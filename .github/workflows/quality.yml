name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native libraries and create the test environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            gir1.2-glib-2.0 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libopengl0 \
            libx11-xcb1 \
            libxi6 \
            libxrender1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            python3-gi \
            python3-venv
          /usr/bin/python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .ci-venv/bin/python -m pip install --disable-pip-version-check \
            'PyQt6==6.11.0' \
            'cryptography==50.0.0'
          .ci-venv/bin/python - <<'PYTHON'
          import gi
          gi.require_version("Gio", "2.0")
          from gi.repository import Gio, GLib
          from PyQt6 import QtCore, QtWidgets
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          assert Gio is not None and GLib is not None
          assert QtCore.PYQT_VERSION_STR == "6.11.0"
          assert QtWidgets.QApplication is not None
          assert AESGCM is not None
          PYTHON
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Compile Python sources
        run: python -m compileall -q *.py ui_v2 tests tools packaging/flatpak

      - name: Run the exact unit and integration-policy suite
        run: |
          PYTHONPATH="$PWD:$PWD/ui_v2" python - <<'PYTHON'
          import os
          import sys
          import unittest
          from pathlib import Path
          root = Path.cwd().resolve()
          os.chdir(root)
          sys.path[:0] = [str(root), str(root / "ui_v2")]
          suite = unittest.defaultTestLoader.discover(
              start_dir=str(root / "tests"),
              pattern="test_*.py",
          )
          discovered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"QUALITY_TEST_COUNT={discovered}")
          print(f"QUALITY_TESTS_RUN={result.testsRun}")
          passed = result.wasSuccessful() and discovered == 218 and result.testsRun == 218
          raise SystemExit(0 if passed else 1)
          PYTHON

      - name: Run shell launcher tests
        run: |
          bash tests/test_public_launcher_runtime.sh
          bash tests/test_pc_wrapper_runtime.sh

      - name: Run privacy, secret, localization, packaging, and metadata gates
        run: python packaging/flatpak/release_gate.py
