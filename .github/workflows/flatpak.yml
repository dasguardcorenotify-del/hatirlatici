name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: source-build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    container:
      # The latest published Flathub Actions image. The builder action installs
      # the manifest-pinned Freedesktop 26.08 runtime from Flathub.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate upstream metadata
        run: flatpak-builder-lint appstream packaging/flatpak/io.github.dasguardcorenotify_del.hatirlatici.metainfo.xml

      - name: Lint canonical production manifest
        run: flatpak-builder-lint manifest io.github.dasguardcorenotify_del.hatirlatici.yml

      - name: Check Platform sandbox before the source build
        run: |
          flatpak install --noninteractive --assumeyes flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          flatpak build-init "$probe_dir/app" \
            io.github.dasguardcorenotify_del.hatirlatici \
            org.freedesktop.Sdk org.freedesktop.Platform 26.08
          flatpak build --runtime --readonly --unshare=network --die-with-parent \
            "$probe_dir/app" /usr/bin/python3 -c 'print("FLATPAK_RUNTIME_PREFLIGHT=PASS")'

      - name: Build checkout with development manifest
        id: build
        uses: flatpak/flatpak-github-actions/flatpak-builder@d6f00ee69d6c8a7f875ec233e9a8ffea74c6ccef # v6
        with:
          manifest-path: io.github.dasguardcorenotify_del.hatirlatici.Devel.yml
          bundle: hatirlatici-ci-${{ matrix.arch }}.flatpak
          build-bundle: false
          upload-artifact: false
          arch: ${{ matrix.arch }}
          mirror-screenshots-url: https://dl.flathub.org/media
          keep-build-dirs: true
          cache: false
          cache-key: hatirlatici-flatpak-${{ matrix.arch }}-${{ github.sha }}

      - name: Verify exported runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 packaging/flatpak/verify-built-flatpak.py --runtime-smoke flatpak_app

      - name: Lint build and repository
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          flatpak-builder-lint builddir flatpak_app
          flatpak-builder-lint repo repo
